- id: neutron-functional
  purpose: functional
  covers_actions:
  - neutron-cleanup
  timeout_seconds: 60
  adapter:
    type: http_get
    url: https://REQUIRED_NEUTRON_HOST/REQUIRED_CONSUMER_FUNCTIONAL_PATH
    ca_file: /etc/rotation/ca/REQUIRED_neutron.pem
    auth: none
    expected_status: 200
    assertions:
    - path:
      - REQUIRED_FUNCTIONAL_FIELD
      equals: REQUIRED_EXPECTED_VALUE
