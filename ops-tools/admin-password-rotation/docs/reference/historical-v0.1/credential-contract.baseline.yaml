# Baseline only. Review complete topology and safety gates for the target environment.
schema_version: 1
namespace: openstack
representations:
  keystone-admin-env:
    type: fields
    username: OS_USERNAME
    password: OS_PASSWORD
locations:
  keystone-admin:
    secret: keystone-admin
    identity: admin
    role: source
    representation:
      type: fields
      password: password
    actions: []
  barbican-keystone-admin:
    secret: barbican-keystone-admin
    identity: active
    role: propagated
    representation: keystone-admin-env
    actions: []
  cinder-keystone-admin:
    secret: cinder-keystone-admin
    identity: active
    role: propagated
    representation: keystone-admin-env
    actions: []
  glance-keystone-admin:
    secret: glance-keystone-admin
    identity: active
    role: propagated
    representation: keystone-admin-env
    actions: []
  gnocchi-keystone-admin:
    secret: gnocchi-keystone-admin
    identity: active
    role: propagated
    representation: keystone-admin-env
    actions: []
  heat-keystone-admin:
    secret: heat-keystone-admin
    identity: active
    role: propagated
    representation: keystone-admin-env
    actions: []
  magnum-keystone-admin:
    secret: magnum-keystone-admin
    identity: active
    role: propagated
    representation: keystone-admin-env
    actions: []
  placement-keystone-admin:
    secret: placement-keystone-admin
    identity: active
    role: propagated
    representation: keystone-admin-env
    actions: []
  skyline-keystone-admin:
    secret: skyline-keystone-admin
    identity: active
    role: propagated
    representation: keystone-admin-env
    actions: []
  zaqar-keystone-admin:
    secret: zaqar-keystone-admin
    identity: active
    role: propagated
    representation: keystone-admin-env
    actions: []
  nova-keystone-admin:
    secret: nova-keystone-admin
    identity: active
    role: propagated
    representation: keystone-admin-env
    actions: []
  octavia-keystone-admin:
    secret: octavia-keystone-admin
    identity: active
    role: propagated
    representation: keystone-admin-env
    actions: []
  blazar-keystone-admin:
    secret: blazar-keystone-admin
    identity: active
    role: propagated
    representation: keystone-admin-env
    actions: []
  keystone-keystone-admin:
    secret: keystone-keystone-admin
    identity: active
    role: propagated
    representation: keystone-admin-env
    actions:
    - admin-client
  neutron-keystone-admin:
    secret: neutron-keystone-admin
    identity: active
    role: propagated
    representation: keystone-admin-env
    actions:
    - neutron-cleanup
  ceilometer-keystone-admin:
    secret: ceilometer-keystone-admin
    identity: active
    role: propagated
    representation: keystone-admin-env
    actions: []
  ceilometer-keystone-admin-password:
    secret: ceilometer-keystone-admin-password
    identity: admin
    role: propagated
    representation:
      type: fields
      password: password
    actions: []
  octavia-service-auth-etc:
    secret: octavia-etc
    identity: active
    role: propagated
    representation:
      type: ini
      key: octavia.conf
      section: service_auth
      username: username
      password: password
    actions:
    - octavia-api
    - octavia-housekeeping
  octavia-service-auth-worker:
    secret: octavia-worker-default
    identity: active
    role: propagated
    representation:
      type: ini
      key: octavia.conf
      section: service_auth
      username: username
      password: password
    actions:
    - octavia-worker
  octavia-service-auth-health-manager:
    secret: octavia-health-manager-default
    identity: active
    role: propagated
    representation:
      type: ini
      key: octavia.conf
      section: service_auth
      username: username
      password: password
    actions:
    - octavia-health-manager
  blazar-admin-config:
    secret: blazar-etc
    identity: active
    role: propagated
    representation:
      type: ini
      key: blazar.conf
      section: DEFAULT
      username: os_admin_username
      password: os_admin_password
    actions:
    - blazar-api
    - blazar-manager
  openstack-config-admin:
    secret: openstack-config
    identity: active
    role: propagated
    representation:
      type: yaml
      key: clouds.yaml
      username_path:
      - clouds
      - default
      - auth
      - username
      password_path:
      - clouds
      - default
      - auth
      - password
    actions:
    - os-metrics
  generated-clouds-yaml-admin:
    secret: clouds-yaml-secret
    identity: active
    role: propagated
    representation:
      type: yaml
      key: generated-clouds-yaml
      document_path:
      - clouds.yaml
      username_path:
      - clouds
      - default
      - auth
      - username
      password_path:
      - clouds
      - default
      - auth
      - password
    actions: []
actions:
  admin-client:
    type: recreate_pod
    pod: openstack-admin-client
    container: openstack-admin-client
    manifest: /etc/rotation/manifests/utils-openstack-client-admin.yaml
    required_before_start: false
    required_after: true
  neutron-cleanup:
    type: rollout_restart
    kind: DaemonSet
    name: neutron-netns-cleanup-cron-default
  octavia-api:
    type: rollout_restart
    kind: Deployment
    name: octavia-api
  octavia-housekeeping:
    type: rollout_restart
    kind: Deployment
    name: octavia-housekeeping
  octavia-worker:
    type: rollout_restart
    kind: DaemonSet
    name: octavia-worker-default
  octavia-health-manager:
    type: rollout_restart
    kind: DaemonSet
    name: octavia-health-manager-default
  blazar-api:
    type: rollout_restart
    kind: Deployment
    name: blazar-api
  blazar-manager:
    type: rollout_restart
    kind: Deployment
    name: blazar-manager
  os-metrics:
    type: rollout_restart
    kind: Deployment
    name: os-metrics-prometheus-openstack-exporter
