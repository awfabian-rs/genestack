# Derived production profile: source contract minus Freezer and Trove.
# No optional entries or existence-based discovery defaults. Review before use.
namespace: openstack

locations:

  # ---------------------------------------------------------------------------
  # Canonical / breeder admin credential
  # ---------------------------------------------------------------------------

  keystone-admin:
    secret: keystone-admin
    identity: admin
    role: source

    representation:
      type: fields
      password: password

    restart: []


  # ---------------------------------------------------------------------------
  # Standard *-keystone-admin Secrets
  #
  # Standard representation:
  #
  #   data.OS_USERNAME
  #   data.OS_PASSWORD
  #
  # Other OS_* fields are invariant across admin/breakglass transitions.
  # ---------------------------------------------------------------------------

  barbican-keystone-admin:
    secret: barbican-keystone-admin
    identity: active
    role: propagated

    representation:
      type: fields
      username: OS_USERNAME
      password: OS_PASSWORD

    restart: []

  cinder-keystone-admin:
    secret: cinder-keystone-admin
    identity: active
    role: propagated

    representation:
      type: fields
      username: OS_USERNAME
      password: OS_PASSWORD

    restart: []

  glance-keystone-admin:
    secret: glance-keystone-admin
    identity: active
    role: propagated

    representation:
      type: fields
      username: OS_USERNAME
      password: OS_PASSWORD

    restart: []

  gnocchi-keystone-admin:
    secret: gnocchi-keystone-admin
    identity: active
    role: propagated

    representation:
      type: fields
      username: OS_USERNAME
      password: OS_PASSWORD

    restart: []

  heat-keystone-admin:
    secret: heat-keystone-admin
    identity: active
    role: propagated

    representation:
      type: fields
      username: OS_USERNAME
      password: OS_PASSWORD

    restart: []

  magnum-keystone-admin:
    secret: magnum-keystone-admin
    identity: active
    role: propagated

    representation:
      type: fields
      username: OS_USERNAME
      password: OS_PASSWORD

    restart: []

  placement-keystone-admin:
    secret: placement-keystone-admin
    identity: active
    role: propagated

    representation:
      type: fields
      username: OS_USERNAME
      password: OS_PASSWORD

    restart: []

  skyline-keystone-admin:
    secret: skyline-keystone-admin
    identity: active
    role: propagated

    representation:
      type: fields
      username: OS_USERNAME
      password: OS_PASSWORD

    restart: []

  zaqar-keystone-admin:
    secret: zaqar-keystone-admin
    identity: active
    role: propagated

    representation:
      type: fields
      username: OS_USERNAME
      password: OS_PASSWORD

    restart: []

  nova-keystone-admin:
    secret: nova-keystone-admin
    identity: active
    role: propagated

    representation:
      type: fields
      username: OS_USERNAME
      password: OS_PASSWORD

    restart: []

  octavia-keystone-admin:
    secret: octavia-keystone-admin
    identity: active
    role: propagated

    representation:
      type: fields
      username: OS_USERNAME
      password: OS_PASSWORD

    # Consumed by get-port init containers when Octavia worker and
    # health-manager Pods are created. Existing running Pods do not retain
    # a runtime dependency on this credential after init completes, so a
    # change to this Secret does not itself require a restart.
    #
    # The same workloads are currently restarted when their service_auth
    # credential locations change, causing the init containers to consume
    # and thereby exercise the current value of this Secret.
    restart: []

  blazar-keystone-admin:
    secret: blazar-keystone-admin
    identity: active
    role: propagated

    representation:
      type: fields
      username: OS_USERNAME
      password: OS_PASSWORD

    restart: []

  keystone-keystone-admin:
    secret: keystone-keystone-admin
    identity: active
    role: propagated

    representation:
      type: fields
      username: OS_USERNAME
      password: OS_PASSWORD

    restart: []

  neutron-keystone-admin:
    secret: neutron-keystone-admin
    identity: active
    role: propagated

    representation:
      type: fields
      username: OS_USERNAME
      password: OS_PASSWORD

    restart:
      - daemonset/neutron-netns-cleanup-cron-default

  ceilometer-keystone-admin:
    secret: ceilometer-keystone-admin
    identity: active
    role: propagated

    representation:
      type: fields
      username: OS_USERNAME
      password: OS_PASSWORD

    restart: []

  # ---------------------------------------------------------------------------
  # Octavia [service_auth]
  # ---------------------------------------------------------------------------

  octavia-service-auth-etc:
    secret: octavia-etc
    identity: active
    role: propagated

    representation:
      type: ini
      key: octavia.conf
      section: service_auth
      username: username
      password: password

    restart:
      - deployment/octavia-api
      - deployment/octavia-housekeeping

  octavia-service-auth-worker:
    secret: octavia-worker-default
    identity: active
    role: propagated

    representation:
      type: ini
      key: octavia.conf
      section: service_auth
      username: username
      password: password

    restart:
      - daemonset/octavia-worker-default

  octavia-service-auth-health-manager:
    secret: octavia-health-manager-default
    identity: active
    role: propagated

    representation:
      type: ini
      key: octavia.conf
      section: service_auth
      username: username
      password: password

    restart:
      - daemonset/octavia-health-manager-default


  # ---------------------------------------------------------------------------
  # Blazar admin credential in blazar.conf
  # ---------------------------------------------------------------------------

  blazar-admin-config:
    secret: blazar-etc
    identity: active
    role: propagated

    representation:
      type: ini
      key: blazar.conf
      section: DEFAULT
      username: os_admin_username
      password: os_admin_password

    restart:
      - deployment/blazar-api
      - deployment/blazar-manager


  # ---------------------------------------------------------------------------
  # clouds.yaml representations
  # ---------------------------------------------------------------------------

  openstack-config-admin:
    secret: openstack-config
    identity: active
    role: propagated

    representation:
      type: yaml
      key: clouds.yaml
      username_path:
        - clouds
        - default
        - auth
        - username
      password_path:
        - clouds
        - default
        - auth
        - password

    # MISSING INFO:
    # We know the affected pods are selected by:
    #
    #   app.kubernetes.io/name=os-metrics-prometheus-openstack-exporter
    #
    # Determine the stable owning workload rather than putting a pod name
    # or selector into the restart contract.
    restart:
      - deployment/os-metrics-prometheus-openstack-exporter


  # ---------------------------------------------------------------------------
  # Generated clouds.yaml
  #
  # data["generated-clouds-yaml"] contains an outer YAML document:
  #
  #   clouds.yaml: |-
  #     clouds:
  #       ...
  #
  # Thus document_path identifies a scalar containing another YAML document.
  # ---------------------------------------------------------------------------

  generated-clouds-yaml-admin:
    secret: clouds-yaml-secret
    identity: active
    role: propagated

    representation:
      type: yaml
      key: generated-clouds-yaml

      document_path:
        - clouds.yaml

      username_path:
        - clouds
        - default
        - auth
        - username

      password_path:
        - clouds
        - default
        - auth
        - password

    restart: []
